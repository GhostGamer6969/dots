set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g status-position top
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'catppuccin/tmux#v2.1.3'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# set -g @catppuccin_flavor 'mocha' 
# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r M-s run-shell "tmux neww rmpc"
bind-key -r M-f run-shell "tmux neww switcher"
# bind-key  r run-shell "tmux source-file ~/.tmux.conf"; display-message "tmux.conf reloaded"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# Options to make tmux more pleasant
set -g default-terminal "tmux-256color"

# Always use running program name (not directory title)
set -g automatic-rename on
set -g allow-rename off
set -g automatic-rename-format "#{pane_current_command}"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "slanted"

# Show real window name instead of session name
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
# set -g status-right "#{E:@catppuccin_status_application}"
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# run ~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux
# run ~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux
# Or, if using TPM, just run TPM
